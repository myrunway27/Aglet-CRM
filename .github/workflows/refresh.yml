name: Refresh show data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # daily ~6am ET

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch venue listings
        run: node scripts/refresh.mjs --debug
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows.json
          git add -f data/debug || true
          git diff --cached --quiet || git commit -m "Refresh show data (automated fetch from venue sites)"
          git push
      - name: Upload raw page snapshots (for debugging failed venues)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug/
          if-no-files-found: ignore
          retention-days: 5
